name = "halloween-party-album-api"
main = "src/index.js"
compatibility_date = "2026-11-02"
keep_vars = true # Preserve Cloudflare Dashboard-managed secrets/bindings

[vars]
DRIVE_FOLDER_ID = "1cnjXZT6E8DQVmUjA7rTO_GZHzq5eRUQC"
FRONTEND_ORIGIN = "https://pagkalosg.github.io"

# Cloudflare automatically provisions the ALBUM_INDEX KV namespace on deploy.
# After the first deployment, check the generated namespace under Bindings.
# You can pin its generated ID here for deterministic future deployments.
[[kv_namespaces]]
binding = "ALBUM_INDEX"

[triggers]
crons = ["*/5 * * * *"]
