<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <!-- The public GitHub Pages address is an entry point, not the album's host.
       All guests enter through the same-origin Cloudflare password gate. -->
  <script>
    if (location.hostname === 'pagkalosg.github.io' &&
        location.pathname.startsWith('/halloween-party')) {
      location.replace('https://halloween-party-album-api.pagkalosgeo.workers.dev/' + location.hash);
    }
  </script>
  <meta name="theme-color" content="#080709">
  <meta name="description" content="Το Αρχείο των Σκιών — Halloween 2026.">
  <title>Το Αρχείο των Σκιών</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="./assets/gothic-horror-collage.webp" fetchpriority="high">
  <link rel="stylesheet" href="./styles.css?v=7">
</head>
<body>
  <div class="screen-grain" aria-hidden="true"></div>
  <!-- Subtle fixed photographic atmosphere; separate from the foreground gallery. -->
  <div class="ambient-backdrop" id="ambientBackdrop" aria-hidden="true">
    <picture class="ambient-picture">
      
      <img id="ambientImage" src="./assets/gothic-horror-collage.webp" alt="" width="1800" height="1050" loading="lazy" decoding="async">
    </picture>
    <div class="ambient-backdrop-tint"></div>
    <div class="ambient-backdrop-mist"></div>
  </div>

  <header class="topbar wrap">
    <a class="brand" href="#αρχή" aria-label="Το Αρχείο των Σκιών — αρχική">
      <svg class="brand-symbol" viewBox="0 0 44 44" fill="none" aria-hidden="true">
        <circle cx="22" cy="22" r="19" stroke="currentColor" stroke-width=".7" opacity=".75"/>
        <circle cx="22" cy="22" r="15" stroke="currentColor" stroke-width=".5" opacity=".4"/>
        <path d="M23 7c-8 4-10 11-9 17 2 9 9 13 18 10-8-1-12-8-10-15 1-5 4-9 8-12Z" fill="currentColor"/>
        <path d="m32 10 1.2 3.4 3.3 1.2-3.3 1.2-1.2 3.4-1.2-3.4-3.4-1.2 3.4-1.2Z" fill="currentColor"/>
      </svg>

    </a>
    <div class="topbar-actions">
      <a class="topbar-archive" href="#συλλογή" aria-label="Μετάβαση στη συλλογή">Η ΣΥΛΛΟΓΗ <span aria-hidden="true">↓</span></a>
      <button class="logout-button" id="logoutButton" type="button" aria-label="Έξοδος από το αρχείο" title="Έξοδος">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 5H5v14h5M14 8l4 4-4 4M18 12H9"/></svg>
      </button>
    </div>
  </header>


  <!-- The cloud doors meet at the center, then part. No JS = no loader. -->
  <div class="cinematic-intro" id="cinematicIntro" hidden aria-label="Κινηματογραφική εισαγωγή" role="region">
    <div class="intro-backdrop"></div>
    <div class="intro-dark"></div>
    <div class="intro-clouds intro-clouds-distant"></div>
    <!-- Sculpted cloud banks drift independently of the opening fog curtains. -->
    <div class="intro-cloud-puff cloud-puff-1"></div>
    <div class="intro-cloud-puff cloud-puff-2"></div>
    <div class="intro-cloud-puff cloud-puff-3"></div>
    <div class="intro-cloud-puff cloud-puff-4"></div>
    <div class="intro-cloud-puff cloud-puff-5"></div>
    <div class="intro-fog intro-fog-left"></div>
    <div class="intro-fog intro-fog-right"></div>
    <div class="intro-fog intro-fog-low"></div>
    <div class="intro-seam"></div>
    <div class="intro-sigil" aria-hidden="true">
      <svg viewBox="0 0 84 84" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="42" cy="42" r="33" stroke="currentColor" stroke-width="1"/>
        <circle cx="42" cy="42" r="25" stroke="currentColor" stroke-width=".55" opacity=".7"/>
        <path d="m42 12 27 48H15L42 12Z M42 71 15 23h54L42 71Z" stroke="currentColor" stroke-width=".8"/>
        <circle cx="42" cy="42" r="4.2" fill="currentColor"/>
      </svg>
    </div>
    <button type="button" id="introSkip" class="intro-skip">ΠΑΡΑΛΕΙΨΗ <span aria-hidden="true">→</span></button>
  </div>

  <main id="αρχή">
    <section class="cinema-hero wrap" aria-labelledby="main-title">
      <picture class="cinema-picture" aria-hidden="true">
        
        <img id="cinemaHeroImage" src="./assets/gothic-horror-collage.webp" alt="" width="1800" height="1050" decoding="async" fetchpriority="high">
      </picture>
      <div class="cinema-vignette" aria-hidden="true"></div>
      <div class="cinema-red-glow" aria-hidden="true"></div>
      <div class="cinema-bottom-fog" aria-hidden="true"></div>
      <div class="cinema-frame" aria-hidden="true"></div>
      <div class="cinema-title">
        <span class="cinema-emblem" aria-hidden="true">✦</span>
        <h1 id="main-title">ΤΟ ΑΡΧΕΙΟ <span>ΤΩΝ ΣΚΙΩΝ</span></h1>
        <p>Κάποιες στιγμές δεν έπρεπε να καταγραφούν.</p>
        <span class="cinema-divider" aria-hidden="true"><i></i>✣<i></i></span>
      </div>
      <span class="cinema-date" aria-hidden="true">31 · 10 · 2026</span>
    </section>

    <section class="archive wrap" id="συλλογή" aria-labelledby="gallery-heading">
      <header class="archive-heading">
        <div class="archive-heading-text">
          <span class="heading-ornament" aria-hidden="true">✣</span>
          <h2 id="gallery-heading">Τα πειστήρια</h2>
        </div>

      </header>

      <div class="gallery-controls">
        <div class="filterrow" role="group" aria-label="Φίλτρα αρχείων">
          <button class="filter active" type="button" data-filter="all" aria-pressed="true">Όλα <span id="allFilterCount">0</span></button>
          <button class="filter" type="button" data-filter="image" aria-pressed="false">Φωτογραφίες <span id="imageFilterCount">0</span></button>
          <button class="filter" type="button" data-filter="video" aria-pressed="false">Βίντεο <span id="videoFilterCount">0</span></button>
        </div>
        <div class="gallery-tools">
          <label><span class="sr-only">Ταξινόμηση</span>
            <select id="sort" class="select"><option value="new">Νεότερα πρώτα</option><option value="old">Παλαιότερα πρώτα</option></select>
          </label>
        </div>
      </div>

      <div class="loading" id="galleryLoading" hidden><span aria-hidden="true">◈</span> Το αρχείο ανοίγει…</div>
      <div class="gallery" id="gallery"></div>
      <div class="more-wrap" id="moreWrap" hidden><button type="button" id="loadMore">ΠΕΡΙΣΣΟΤΕΡΑ <span aria-hidden="true">↓</span></button></div>
      <div class="noresults" id="noresults" hidden>Το αρχείο είναι άδειο.</div>
    </section>
  </main>

  <footer class="footer wrap"><span>© 2026 · Το Αρχείο των Σκιών</span><span class="footer-symbol" aria-hidden="true">✦</span></footer>

  <!-- Immersive, edge-to-edge viewer: just the media and native-style arrows. -->
  <dialog class="viewer" id="viewDialog" aria-label="Πλήρης προβολή φωτογραφίας ή βίντεο">
    <div class="viewer-stage" id="viewerStage">
      <button type="button" class="viewer-close" id="closeViewer" aria-label="Κλείσιμο προβολής">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
      <button type="button" class="viewnav viewprev" id="prevBtn" aria-label="Προηγούμενο αρχείο">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
      </button>
      <div id="viewerMedia"></div>
      <button type="button" class="viewnav viewnext" id="nextBtn" aria-label="Επόμενο αρχείο">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
      </button>
    </div>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="./config.js"></script>
  <script defer src="./intro.js?v=2"></script>
  <script defer src="./app.js?v=6"></script>
</body>
</html>
