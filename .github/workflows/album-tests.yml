name: Album security and frontend smoke tests
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'app.js'
      - 'intro.js'
      - 'index.html'
      - 'styles.css'
      - 'assets/**'
      - '.github/workflows/album-tests.yml'
  pull_request:
    paths:
      - 'worker/**'
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - 'assets/**'
      - '.github/workflows/album-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check intro.js
          node --check worker/src/index.js
          node --check worker/src/gate.js
      - name: Reject obsolete upload and owner UI
        run: |
          test ! -e owner.html
          test ! -e owner.js
          if grep -E -q 'id="(uploadDialog|navUpload|heroUpload|bottomUpload|startUpload)"' index.html; then
            echo "Obsolete uploader UI detected"
            exit 1
          fi
      - name: Verify custom horror collage and drifting cloud layers
        run: |
          test -s assets/butler-door.webp
          test -s assets/gothic-horror-collage.webp
          grep -q 'halloween-party-album-api.pagkalosgeo.workers.dev/' index.html
          test "$(wc -c < assets/gothic-horror-collage.webp)" -lt 950000
          grep -q 'assets/gothic-horror-collage.webp' index.html
          grep -q 'id="cinematicIntro"' index.html
          grep -q 'src="./intro.js?v=2"' index.html
          grep -q 'id="ambientBackdrop"' index.html
          grep -q 'class="intro-cloud-puff cloud-puff-5"' index.html
          grep -q 'id="introSkip"' index.html
      - name: Worker security smoke tests
        working-directory: worker
        run: npm test
