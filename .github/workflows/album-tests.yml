name: Album security and frontend smoke tests
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'app.js'
      - 'parallax.js'
      - 'index.html'
      - 'styles.css'
      - 'assets/**'
      - '.github/workflows/album-tests.yml'
  pull_request:
    paths:
      - 'worker/**'
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - 'assets/**'
      - '.github/workflows/album-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check parallax.js
          node --check worker/src/index.js
          node --check worker/src/gate.js
      - name: Reject obsolete upload and owner UI
        run: |
          test ! -e owner.html
          test ! -e owner.js
          if grep -E -q 'id="(uploadDialog|navUpload|heroUpload|bottomUpload|startUpload)"' index.html; then
            echo "Obsolete uploader UI detected"
            exit 1
          fi
      - name: Verify direct gallery entry and removed legacy fog
        run: |
          test -s assets/butler-door.webp
          test -s assets/gothic-horror-collage.webp
          test ! -e intro.js
          test ! -e assets/haunted-hero-desktop.webp
          test ! -e assets/haunted-hero-mobile.webp
          test ! -e .github/workflows/hero-asset.yml
          grep -q 'halloween-party-album-api.pagkalosgeo.workers.dev/' index.html
          grep -q 'assets/gothic-horror-collage.webp' index.html
          grep -q 'src="./parallax.js?v=1"' index.html
          grep -q 'id="ambientBackdrop"' index.html
          if grep -E -q 'cinematicIntro|intro-sigil|intro-fog|introSkip|cinema-bottom-fog' index.html; then
            echo "Old cinematic loader remains in HTML"
            exit 1
          fi
          if grep -E -q 'cinematic-intro|intro-fog|intro-sigil|cinema-bottom-fog' styles.css; then
            echo "Old loader CSS remains"
            exit 1
          fi
      - name: Worker security smoke tests
        working-directory: worker
        run: npm test
