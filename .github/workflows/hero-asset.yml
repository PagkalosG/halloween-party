name: Prepare photoreal cinematic hero assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hero-asset.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image optimizer
        run: python -m pip install --quiet pillow
      - name: Download and optimize real licensed photograph
        run: |
          python - <<'PY'
          import io, os, urllib.request
          from PIL import Image, ImageOps, ImageEnhance

          url = "https://images.unsplash.com/photo-1768739538834-a3edb42db797?auto=format&fit=crop&w=2400&q=85"
          request = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(request, timeout=50) as response:
              content_type = response.headers.get("Content-Type", "")
              raw = response.read(12 * 1024 * 1024 + 1)
          if not content_type.startswith("image/") or len(raw) > 12 * 1024 * 1024:
              raise RuntimeError("Unexpected image response")
          src = Image.open(io.BytesIO(raw)).convert("RGB")
          if min(src.size) < 700:
              raise RuntimeError("Source photo too small")

          os.makedirs("assets", exist_ok=True)
          for output, dimensions, focus, quality in [
              ("assets/haunted-hero-desktop.webp", (1800, 1050), (0.53, 0.50), 82),
              ("assets/haunted-hero-mobile.webp", (840, 1150), (0.53, 0.48), 78)
          ]:
              img = ImageOps.fit(src, dimensions, method=Image.Resampling.LANCZOS, centering=focus)
              img = ImageEnhance.Color(img).enhance(0.68)
              img = ImageEnhance.Contrast(img).enhance(1.18)
              img = ImageEnhance.Brightness(img).enhance(0.77)
              img.save(output, format="WEBP", quality=quality, method=6)
              if os.path.getsize(output) > 950_000:
                  raise RuntimeError("Hero asset exceeded mobile performance budget")
              print(output, dimensions, os.path.getsize(output), "bytes")
          PY
      - name: Commit optimized hero assets only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/haunted-hero-desktop.webp assets/haunted-hero-mobile.webp
          if ! git diff --cached --quiet; then
            git commit -m "assets: add optimized photoreal haunted hero backgrounds"
            git push origin HEAD:main
          fi
